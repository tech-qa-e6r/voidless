name: Release

# Builds Voidless from the private source repo (tech-qa-e6r/Voidless.app) and publishes signed
# installers + the updater manifest (latest.json) as a draft release in THIS public repo. The
# app's in-app updater points at this repo's latest release.
#
# Secrets live in the `release` environment (Settings → Environments → release), not at repo
# level: only the job that names that environment gets them, and only after a reviewer approves
# the run.
#   SOURCE_TOKEN                        PAT with read access to the source repo
#   TAURI_SIGNING_PRIVATE_KEY           contents of ~/.tauri/voidless_updater.key
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD  the key password
#   VITE_GOOGLE_CLIENT_ID               Google OAuth client id (build-time, Calendar push)
#   VITE_GOOGLE_CLIENT_SECRET           Google OAuth client secret (build-time, Calendar push)
#
# Supply chain: every action is pinned to a full commit SHA (the tag it came from is in the
# comment) and pnpm to an exact version. Bump them on purpose, never back to a moving tag.
# Signing happens inside tauri-action's `tauri build`, so the key is in the same job as vite,
# node_modules and every build.rs — keep dependencies few.

on:
  workflow_dispatch:

# Least privilege by default; a job that needs more asks for it below.
permissions:
  contents: read

jobs:
  # Pick the build number ONCE (shared by both matrix jobs so they produce the same
  # version and merge into one release). Per-day counter that resets daily: count
  # today's existing releases (vYY.M.D.N, drafts included) and take max + 1.
  prepare:
    runs-on: ubuntu-latest
    # Write only so the listing includes DRAFT releases (a read-only token doesn't see them,
    # and a same-day build would reuse a draft's number). No checkout, no third-party code here.
    permissions:
      contents: write
    outputs:
      build_number: ${{ steps.bn.outputs.build_number }}
    steps:
      - name: Compute build number
        id: bn
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          core="$(date -u +%y).$(date -u +%-m).$(date -u +%-d)"
          max=$(gh release list --repo "${{ github.repository }}" --limit 200 --json tagName \
                --jq "[.[].tagName | select(startswith(\"v${core}.\")) | ltrimstr(\"v${core}.\") | tonumber] | max // 0")
          echo "build_number=$((max + 1))" >> "$GITHUB_OUTPUT"

  release:
    needs: prepare
    # Holds the secrets above; a required reviewer approves before the job starts.
    environment: release
    permissions:
      contents: write # tauri-action creates the draft release and uploads the assets
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS: universal binary so one .dmg runs on both Intel and Apple Silicon.
          - os: macos-latest
            args: "--target universal-apple-darwin"
            rust-targets: "aarch64-apple-darwin,x86_64-apple-darwin"
          - os: windows-latest
            args: ""
            rust-targets: ""

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout private source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: tech-qa-e6r/Voidless.app
          token: ${{ secrets.SOURCE_TOKEN }}
          # Don't leave the PAT in .git/config for the later steps (pnpm scripts, vite, build.rs).
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          # Exact version, never a bare major: 11.18.0 was published 2026-07-29, before the npm
          # worm of 2026-08-04, and is the last pre-incident pnpm this workflow built with.
          version: 11.18.0

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch, 2026-10-16
        with:
          toolchain: stable
          targets: ${{ matrix.rust-targets }}

      - name: Rust cache
        uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: ./alt-text-editor/src-tauri -> target

      - name: Install dependencies
        working-directory: alt-text-editor
        run: pnpm install --frozen-lockfile

      # Stamp the date-based version (YY.M.D+N) into tauri.conf.json before building.
      # N comes from the prepare job (shared across the matrix so mac + win match).
      - name: Stamp version
        working-directory: alt-text-editor
        env:
          BUILD_NUMBER: ${{ needs.prepare.outputs.build_number }}
        run: node scripts/stamp-version.mjs

      - name: Read stamped version
        id: ver
        shell: bash
        working-directory: alt-text-editor
        run: echo "version=$(node -p "require('./src-tauri/tauri.conf.json').version.replace('+','.')")" >> "$GITHUB_OUTPUT"

      # tauri-action builds + signs, then creates/updates the release for this tag and
      # uploads installers, updater bundles (.sig) and a merged latest.json across the
      # macOS + Windows matrix. Draft so it can be reviewed before going live.
      # The signing key has to be in this step: `tauri build` signs while bundling, and
      # tauri-action has no separate signing step. Only this step gets it.
      - name: Build & release
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0.6.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          VITE_GOOGLE_CLIENT_ID: ${{ secrets.VITE_GOOGLE_CLIENT_ID }}
          VITE_GOOGLE_CLIENT_SECRET: ${{ secrets.VITE_GOOGLE_CLIENT_SECRET }}
        with:
          projectPath: alt-text-editor
          tagName: v${{ steps.ver.outputs.version }}
          releaseName: Voidless v${{ steps.ver.outputs.version }}
          releaseDraft: true
          includeUpdaterJson: true
          args: ${{ matrix.args }}
